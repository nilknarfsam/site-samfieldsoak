<div class="home">
  <section class="home-topo" aria-labelledby="home-titulo">
    <div class="home-topo__mosaico" aria-hidden="true" data-mosaico></div>
    <div class="home-topo__conteudo">
      <div class="home-topo__retrato" data-retrato></div>
      <p class="home-topo__nome" data-nome></p>
      <h1 id="home-titulo" class="home-topo__frase" data-frase></h1>
      <ul class="papeis lista-limpa" data-papeis></ul>
      <ul class="numeros lista-limpa" data-numeros aria-label="Em números"></ul>
    </div>
  </section>

  <section class="home-bloco" aria-labelledby="lancamento-titulo">
    <h2 id="lancamento-titulo" class="sobretitulo">Último lançamento</h2>
    <div class="lancamento" data-lancamento></div>
  </section>

  <section class="home-bloco" aria-labelledby="atalhos-titulo">
    <h2 id="atalhos-titulo" class="sobretitulo">Veio do Instagram? Comece por aqui</h2>
    <ul class="bio-lista bio-lista--compacta" data-links></ul>
  </section>

  <section class="home-bloco novidade" aria-labelledby="novidade-titulo" id="novidade" hidden>
    <h2 class="sobretitulo novidade__rotulo" id="novidade-titulo">Novidades</h2>
    <ul class="novidade__lista lista-limpa" data-novidade></ul>
    <p class="novidade__todas"><a href="#/novidades">Ver todas as novidades <span aria-hidden="true">→</span></a></p>
  </section>

  <section class="home-bloco" aria-labelledby="frentes-titulo">
    <h2 id="frentes-titulo" class="secao-musica__titulo">O que você encontra aqui</h2>
    <ul class="grid lista-limpa frentes" data-frentes></ul>
  </section>
</div>
